<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mck Project - Информация о сервере</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .info-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h2 {
            font-size: 2.2em;
            margin-bottom: 30px;
            background: linear-gradient(to right, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(67, 233, 123, 0.15);
            padding: 8px 20px;
            border-radius: 25px;
            margin-bottom: 30px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #43e97b;
            border-radius: 50%;
            box-shadow: 0 0 10px #43e97b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 5px #43e97b;
            }
            50% {
                box-shadow: 0 0 20px #43e97b, 0 0 30px #43e97b;
            }
        }

        .online-text {
            color: #43e97b;
            font-weight: bold;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .server-ip {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 20px;
            margin: 25px 0;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .ip-label {
            font-size: 0.9em;
            opacity: 0.6;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .ip-address {
            font-size: 2.8em;
            font-weight: bold;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }

        .copy-btn {
            margin-top: 20px;
            padding: 14px 30px;
            font-size: 1em;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 30px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .copy-btn.copied {
            background: linear-gradient(45deg, #43e97b, #38f9d7);
        }

        .additional-info {
            margin-top: 20px;
            opacity: 0.7;
            line-height: 1.8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="info-container">
        <h2>Информация о сервере</h2>
        
        <div class="status-badge">
            <span class="status-dot"></span>
            <span class="online-text">Сервер онлайн</span>
        </div>
        
        <div class="server-ip">
            <div class="ip-label">IP Адрес</div>
            <div class="ip-address">mck.c6t.ru</div>
            <button class="copy-btn" onclick="copyIP()">
                📋 Скопировать IP
            </button>
        </div>
        
        <div class="additional-info">
            <p>Подключайтесь к нашему серверу прямо сейчас!</p>
            <p>Версия: 1.16.5 - 1.20.x</p>
        </div>
        
        <a href="menu.html" class="back-btn">← Вернуться в меню</a>
    </div>
    
    <script>
        function copyIP() {
            const btn = document.querySelector('.copy-btn');
            navigator.clipboard.writeText('mck.c6t.ru').then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Скопировано!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Запасной вариант для старых браузеров
                const textArea = document.createElement('textarea');
                textArea.value = 'mck.c6t.ru';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Скопировано!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
